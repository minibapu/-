<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起讀書吧！線上監督與加油站 (連線版)</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- 頂部導覽列 -->
    <nav class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">📚 一起讀書吧！Study Together</h1>
            <div class="text-sm bg-indigo-700 px-3 py-1 rounded-full">
                雲端資料庫：<span id="db-status" class="font-bold text-yellow-300">連線中...</span>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto p-4 mt-4 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- 左欄：我的讀書計時器 & 線上監督名單 -->
        <div class="space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 text-indigo-700">⏱️ 我的讀書監督器</h2>
                
                <div class="mb-3">
                    <label class="block text-xs text-slate-500 mb-1">你的暱稱</label>
                    <input type="text" id="username-input" placeholder="輸入你的名字..." class="w-full border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="mb-4">
                    <label class="block text-xs text-slate-500 mb-1">正在讀什麼科目？</label>
                    <input type="text" id="subject-input" placeholder="例如：微積分、英文單字..." value="期末考複習" class="w-full border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="bg-slate-50 p-4 rounded-lg text-center mb-4 border">
                    <div id="status-badge" class="inline-block px-2 py-0.5 text-xs rounded-full bg-slate-200 text-slate-600 mb-1">休息中</div>
                    <div id="timer-display" class="text-3xl font-mono font-bold text-slate-800">00:00:00</div>
                </div>

                <button id="toggle-study-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-lg transition shadow-sm">
                    ▶ 開始專注讀書
                </button>
            </div>

            <!-- 線上即時監督名單 -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 text-slate-700">👀 誰正在認真讀書？</h2>
                <ul id="study-list" class="space-y-3 text-sm">
                    <li class="text-slate-400 text-xs text-center py-2">目前還沒有人在線讀書，快搶頭香！</li>
                </ul>
            </div>
        </div>

        <!-- 右欄：互相鼓勵留言牆 -->
        <div class="md:col-span-2 space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 text-indigo-700">💬 發布目標 / 互相打氣</h2>
                <textarea id="post-content" rows="2" placeholder="寫下今天的讀書目標，或給大家一句鼓勵的話吧！" class="w-full border rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 mb-3"></textarea>
                <div class="flex justify-end">
                    <button id="add-post-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-5 py-2 rounded-lg transition">
                        發布動態 ✨
                    </button>
                </div>
            </div>

            <!-- 留言動態列表 -->
            <div id="posts-container" class="space-y-4">
                <div class="text-center text-slate-400 text-sm py-8">正在載入大家的動態...</div>
            </div>
        </div>
    </main>

    <!-- 引入 Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { 
            getFirestore, collection, addDoc, onSnapshot, 
            query, orderBy, doc, updateDoc, increment, 
            deleteDoc, serverTimestamp, arrayUnion 
        } from "https://gstatic.com";

        // 已幫你填好專屬金鑰！
        const firebaseConfig = {
            apiKey: "AIzaSyAE-aiN8NIaKrqpwvd1I6pZq6aHgg1zOH4",
            authDomain: "://firebaseapp.com",
            projectId: "study-6f4aa",
            storageBucket: "study-6f4aa.firebasestorage.app",
            messagingSenderId: "161998041199",
            appId: "1:161998041199:web:7a54aa1c32ad8a49701d9a",
            measurementId: "G-7SWFCYY5MF"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        document.getElementById('db-status').innerText = "已連線 🟢";

        const randomNum = Math.floor(Math.random() * 900) + 100;
        document.getElementById('username-input').value = `讀書夥伴#${randomNum}`;

        // 功能一：讀書狀態同步
        let isStudying = false;
        let seconds = 0;
        let timerInterval = null;
        let myStudyDocId = null;

        document.getElementById('toggle-study-btn').addEventListener('click', async () => {
            const btn = document.getElementById('toggle-study-btn');
            const badge = document.getElementById('status-badge');
            const username = document.getElementById('username-input').value.trim() || '匿名同學';
            const subject = document.getElementById('subject-input').value.trim() || '自習';

            if (!isStudying) {
                isStudying = true;
                btn.innerText = '⏹ 結束讀書並打卡';
                btn.classList.replace('bg-emerald-500', 'bg-rose-500');
                btn.classList.replace('hover:bg-emerald-600', 'hover:bg-rose-600');
                badge.innerText = '🔥 專注監督中';
                badge.classList.replace('bg-slate-200', 'bg-emerald-100');
                badge.classList.replace('text-slate-600', 'text-emerald-700');

                const docRef = await addDoc(collection(db, "active_studiers"), {
                    username: username,
                    subject: subject,
                    startTime: serverTimestamp()
                });
                myStudyDocId = docRef.id;

                timerInterval = setInterval(() => {
                    seconds++;
                    document.getElementById('timer-display').innerText = formatTime(seconds);
                }, 1000);

            } else {
                isStudying = false;
                clearInterval(timerInterval);
                btn.innerText = '▶ 開始專注讀書';
                btn.classList.replace('bg-rose-500', 'bg-emerald-500');
                btn.classList.replace('hover:bg-rose-600', 'hover:bg-emerald-600');
                badge.innerText = '休息中';
                badge.classList.replace('bg-emerald-100', 'bg-slate-200');
                badge.classList.replace('text-emerald-700', 'text-slate-600');

                if (myStudyDocId) {
                    await deleteDoc(doc(db, "active_studiers", myStudyDocId));
                    myStudyDocId = null;
                }

                const timeStr = formatTime(seconds);
                await addDoc(collection(db, "posts"), {
                    author: username,
                    content: `我剛剛專注讀了「${subject}」共 ${timeStr}！求大家給個鼓勵 🎉`,
                    tag: '完成打卡',
                    likes: 0,
                    comments: [],
                    createdAt: serverTimestamp()
                });

                seconds = 0;
                document.getElementById('timer-display').innerText = '00:00:00';
            }
        });

        onSnapshot(collection(db, "active_studiers"), (snapshot) => {
            const studyList = document.getElementById('study-list');
            studyList.innerHTML = '';
            
            if (snapshot.empty) {
                studyList.innerHTML = '<li class="text-slate-400 text-xs text-center py-2">目前還沒有人在線讀書，快搶頭香！</li>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-2 bg-emerald-50 rounded-lg border border-emerald-100';
                li.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-800">${escapeHTML(data.username)}</span>
                        <p class="text-xs text-slate-500">正在讀：${escapeHTML(data.subject)}</p>
                    </div>
                    <span class="text-xs bg-emerald-500 text-white px-2 py-1 rounded-full animate-pulse">讀書中</span>
                `;
                studyList.appendChild(li);
            });
        });

        // 功能二：發布動態、按讚、留言
        document.getElementById('add-post-btn').addEventListener('click', async () => {
            const contentInput = document.getElementById('post-content');
            const content = contentInput.value.trim();
            const username = document.getElementById('username-input').value.trim() || '匿名同學';

            if (!content) return alert('請輸入內容再發布喔！');

            contentInput.value = '';
            await addDoc(collection(db, "posts"), {
                author: username,
                content: content,
                tag: '目標 / 鼓勵',
                likes: 0,
                comments: [],
                createdAt: serverTimestamp()
            });
        });

        const postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(postsQuery, (snapshot) => {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            if (snapshot.empty) {
                container.innerHTML = '<div class="text-center text-slate-400 text-sm py-8">還沒有任何動態，快來發第一篇鼓勵大家吧！</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
              const postId = docSnap.id;
let commentsHTML = '';
if (post.comments && post.comments.length > 0) {
post.comments.forEach(c => {
commentsHTML += <div><span class="font-bold text-slate-700">${escapeHTML(c.author)}：</span>${escapeHTML(c.text)}</div>;
});
}
const postDiv = document.createElement('div');
postDiv.className = 'bg-white p-5 rounded-xl shadow-sm border border-slate-200';
postDiv.innerHTML = `


${escapeHTML(post.author)}

${escapeHTML(post.tag)}
${escapeHTML(post.content)}
👏 幫他加油
${post.likes || 0}

${commentsHTML}


送出


`;
container.appendChild(postDiv);
});
document.querySelectorAll('.like-btn').forEach(btn => {
btn.addEventListener('click', async () => {
const id = btn.getAttribute('data-id');
await updateDoc(doc(db, "posts", id), {
likes: increment(1)
});
});
});
document.querySelectorAll('.comment-btn').forEach(btn => {
btn.addEventListener('click', async () => {
const id = btn.getAttribute('data-id');
const input = btn.previousElementSibling;
const text = input.value.trim();
const username = document.getElementById('username-input').value.trim() || '匿名同學';
if (!text) return;
input.value = '';
await updateDoc(doc(db, "posts", id), {
comments: arrayUnion({
author: username,
text: text
})
});
});
});
});
function formatTime(sec) {
const hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
const mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
const secs = String(sec % 60).padStart(2, '0');
return ${hrs}:${mins}:${secs};
}
function escapeHTML(str) {
if (!str) return '';
return str.replace(/[&<>'"]/g, tag => ({
'&': '&', '<': '<', '>': '>', "'": ''', '"': '"'
}[tag]));
}
